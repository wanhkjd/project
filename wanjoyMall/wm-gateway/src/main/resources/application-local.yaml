spring:
  config:
    import:
      # 本地共享配置：JDBC、日志、接口文档、Redis、Seata（按服务需要加载）。
      - classpath:wm-shared-log.yaml
      - classpath:wm-shared-redis.yaml
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: wm-item
              uri: lb://item-service
              predicates:
                - Path=/items/**,/search/**,/seckill/**
            - id: wm-cart
              uri: lb://cart-service
              predicates:
                - Path=/carts/**
            - id: wm-user
              uri: lb://user-service
              predicates:
                - Path=/users/**,/addresses/**
            - id: wm-trade
              uri: lb://trade-service
              predicates:
                - Path=/orders/**
            - id: wm-pay
              uri: lb://pay-service
              predicates:
                - Path=/pay-orders/**
wm:
  gateway:
    dynamic-routes:
      enabled: false
      data-id: wm-gateway-routes.json
      group: ${NACOS_GROUP:DEFAULT_GROUP}
