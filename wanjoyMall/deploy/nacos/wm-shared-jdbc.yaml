# 共享 MyBatis / JDBC 配置；业务库沿用已有 hm-* 名称，由各服务的 wm.db.database 指定。
spring:
  datasource:
    url: jdbc:mysql://${wm.db.host}:${WM_DB_PORT:3306}/${wm.db.database}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${WM_DB_USER:root}
    password: ${WM_DB_PASSWORD:}
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
